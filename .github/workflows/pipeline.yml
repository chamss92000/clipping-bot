name: clipping-pipeline

# Clips gaming (focus GTA 6) : 2 livraisons/jour + manuel.
# 11:00 UTC = clips de la nuit US/soirée EU ; 19:00 UTC = prime time FR + après-midi US.
on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      detect_only:
        description: "Détection seule (dump candidats, pas de traitement)"
        type: boolean
        default: false
      dry_run:
        description: "Test : clips déposés sur Drive mais pas d'e-mail"
        type: boolean
        default: true

concurrency:
  group: clipping-pipeline
  cancel-in-progress: false   # on ne coupe pas un cycle en cours

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # garde-fou sur le budget Actions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + polices sous-titres
        run: |
          # Les dépôts TIERS pré-installés sur le runner (Chrome, Microsoft) cassent
          # parfois `apt-get update` (Hash Sum mismatch) et font échouer l'étape
          # alors qu'on n'a besoin que des paquets Ubuntu. On retire uniquement ces
          # .list tiers (jamais les dépôts Ubuntu en .sources) et on rend update
          # non bloquant : les index Ubuntu se rafraîchissent, l'install passe.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list || true
          sudo apt-get update || true
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp   # toujours la derniere version (extracteur Twitch)

      - name: Tests unitaires (rapides, sans réseau)
        run: python -m pytest -q tests

      - name: Cache modele Whisper (HuggingFace)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'large-v3-turbo' }}
          
      - name: Run pipeline
        env:
          # --- Secrets ---
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          # --- Jeux (modifiable dans Settings > Variables, sans code) ---
          # nom EXACT de la catégorie Twitch, séparés par des virgules
          GAMES_PRIMARY: ${{ vars.GAMES_PRIMARY || 'Grand Theft Auto VI' }}
          # complètent le quota si le prioritaire ne suffit pas ("" = prioritaires seulement)
          GAMES_SECONDARY: ${{ vars.GAMES_SECONDARY || 'Grand Theft Auto V' }}
          # --- Marchés / dossiers Drive (fr => chaîne FR, intl => chaîne EN) ---
          MARKETS: ${{ vars.MARKETS || 'fr,intl' }}
          TWITCH_LANGUAGES: ${{ vars.TWITCH_LANGUAGES || 'fr,en' }}
          CLIPS_PER_MARKET: ${{ vars.CLIPS_PER_MARKET || '3' }}
          MAX_CLIPS_PER_RUN: ${{ vars.MAX_CLIPS_PER_RUN || '6' }}
          DRIVE_CLEANUP_MAX_AGE_H: ${{ vars.DRIVE_CLEANUP_MAX_AGE_H || '48' }}
          # --- Sélection des clips ---
          TWITCH_CLIPS_DAYS: ${{ vars.TWITCH_CLIPS_DAYS || '3' }}
          TWITCH_CLIP_MIN_VIEWS: ${{ vars.TWITCH_CLIP_MIN_VIEWS || '100' }}
          MAX_CLIPS_PER_STREAMER: ${{ vars.MAX_CLIPS_PER_STREAMER || '2' }}
          # note mini (0-100) donnée par le LLM après avoir regardé le clip
          CLIP_MIN_SCORE: ${{ vars.CLIP_MIN_SCORE || '55' }}
          CHANNEL_BLACKLIST: ${{ vars.CHANNEL_BLACKLIST || '' }}
          # --- Mode campagne (clips payés à la vue) : créateurs ciblés en priorité ---
          TARGET_STREAMERS_TWITCH: ${{ vars.TARGET_STREAMERS_TWITCH || '' }}
          TARGET_ONLY: ${{ vars.TARGET_ONLY || 'false' }}
          # --- Rendu ---
          FRAMING: ${{ vars.FRAMING || 'auto' }}
          TITLE_STYLE: ${{ vars.TITLE_STYLE || 'outline' }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'large-v3-turbo' }}
          # --- Notification e-mail (récap des clips déposés) ---
          NOTIFY_EMAIL_ENABLE: ${{ vars.NOTIFY_EMAIL_ENABLE || 'true' }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO || 'ce.boutajar@gmail.com' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # --- Tuning ---
          LOG_LEVEL: INFO
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${{ inputs.detect_only }}" = "true" ]; then
            python main.py --detect-only
          else
            python main.py
          fi

      - name: Upload artefacts (logs / candidats) en cas d'échec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-debug
          path: |
            work/candidates.json
            work/pipeline.log
            work/rapport.md
          if-no-files-found: ignore
          retention-days: 5
