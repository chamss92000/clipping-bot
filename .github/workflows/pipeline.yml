name: clipping-pipeline

# Bloc 8 — Orchestration : cron toutes les 6h + déclenchement manuel.
on:
  schedule:
    - cron: "0 */6 * * *"      # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:
    inputs:
      detect_only:
        description: "Détection seule (dump candidats, pas de traitement)"
        type: boolean
        default: false
      dry_run:
        description: "Ne rien publier"
        type: boolean
        default: true

concurrency:
  group: clipping-pipeline
  cancel-in-progress: false   # on ne coupe pas un cycle en cours

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # garde-fou sur le budget Actions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + polices sous-titres
        run: |
          # Les dépôts TIERS pré-installés sur le runner (Chrome, Microsoft) cassent
          # parfois `apt-get update` (Hash Sum mismatch) et font échouer l'étape
          # alors qu'on n'a besoin que des paquets Ubuntu. On retire uniquement ces
          # .list tiers (jamais les dépôts Ubuntu en .sources) et on rend update
          # non bloquant : les index Ubuntu se rafraîchissent, l'install passe.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list || true
          sudo apt-get update || true
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp   # toujours la derniere version (extraction YouTube)

      - name: Cache modele Whisper (HuggingFace)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-faster-${{ hashFiles('config/settings.py') }}
          restore-keys: whisper-faster-

      - name: Cookies YouTube (optionnel — contourne la verif anti-bot)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt
            echo "Cookies YouTube configures."
          else
            echo "Pas de cookies YouTube (optionnel) - on compte sur les clients alternatifs et Twitch/Kick."
          fi

      - name: Run pipeline
        env:
          # --- Bloc 1 ---
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          # --- Bloc 4 ---
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # --- Bloc 2 (storage Drive, OAuth headless) ---
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          # --- Bloc 7 (TikTok API officielle) ---
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'SELF_ONLY' }}
          # --- Bloc 7bis (YouTube Shorts auto — DÉSACTIVÉ : dépôt Drive uniquement) ---
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_UPLOAD_ENABLE: ${{ vars.YOUTUBE_UPLOAD_ENABLE || 'false' }}
          # --- Marchés / dossiers Drive (fr => nouvelle chaîne, intl => chaîne existante) ---
          MARKETS: ${{ vars.MARKETS || 'fr,intl' }}
          # purge auto des clips plus vieux que N heures (garde de la place)
          DRIVE_CLEANUP_MAX_AGE_H: ${{ vars.DRIVE_CLEANUP_MAX_AGE_H || '48' }}
          # --- Tuning qualité (modifiable dans Settings > Variables, sans code) ---
          # ex. TWITCH_LANGUAGES=fr pour ne cibler que des sources francophones
          TWITCH_LANGUAGES: ${{ vars.TWITCH_LANGUAGES || 'fr,en' }}
          # seuil de qualité des moments (0-100) : plus haut = moins de clips mais meilleurs
          GEMINI_MIN_SCORE: ${{ vars.GEMINI_MIN_SCORE || '78' }}
          # chaînes à exclure (séparées par des virgules)
          CHANNEL_BLACKLIST: ${{ vars.CHANNEL_BLACKLIST || '' }}
          # cadrage : auto | face | blur
          FRAMING: ${{ vars.FRAMING || 'auto' }}
          # --- Source Twitch Clips (moments déjà viraux) ---
          TWITCH_SOURCE: ${{ vars.TWITCH_SOURCE || 'clips' }}
          # ne garder que les clips au-dessus de N vues (ex. 500 = gros clips only)
          TWITCH_CLIP_MIN_VIEWS: ${{ vars.TWITCH_CLIP_MIN_VIEWS || '50' }}
          # fenêtre de fraîcheur des clips, en jours
          TWITCH_CLIPS_DAYS: ${{ vars.TWITCH_CLIPS_DAYS || '7' }}
          # objectif de clips PAR chaîne (fr + intl) — chaque marché a sa place réservée
          CLIPS_PER_MARKET: ${{ vars.CLIPS_PER_MARKET || '2' }}
          MAX_CLIPS_PER_RUN: ${{ vars.MAX_CLIPS_PER_RUN || '4' }}
          # YouTube comme source : off par defaut (anti-bot en CI). Mets 'true' + cookies pour l'activer.
          YOUTUBE_SOURCE_ENABLE: ${{ vars.YOUTUBE_SOURCE_ENABLE || 'false' }}
          # --- Notification e-mail (récap des clips déposés) ---
          NOTIFY_EMAIL_ENABLE: ${{ vars.NOTIFY_EMAIL_ENABLE || 'true' }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO || 'ce.boutajar@gmail.com' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # --- Tuning ---
          LOG_LEVEL: INFO
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${{ inputs.detect_only }}" = "true" ]; then
            python main.py --detect-only
          else
            python main.py
          fi

      - name: Upload artefacts (logs / candidats) en cas d'échec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-debug
          path: |
            work/candidates.json
            pipeline.log
          if-no-files-found: ignore
          retention-days: 5
