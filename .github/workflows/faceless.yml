name: faceless-content

# Génère les vidéos faceless "valeur" (niche argent/IA). Cron dédié.
on:
  schedule:
    - cron: "0 9,17 * * *"     # 09:00 et 17:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Générer sans uploader"
        type: boolean
        default: false

concurrency:
  group: faceless-content
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + polices
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list || true
          sudo apt-get update || true
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache modele Whisper (HuggingFace)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-faster-${{ hashFiles('config/settings.py') }}
          restore-keys: whisper-faster-

      - name: Run faceless generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          # b-roll libre de droits (optionnel : clé gratuite pexels.com/api)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # notif e-mail (mêmes secrets que le clipping)
          NOTIFY_EMAIL_ENABLE: ${{ vars.NOTIFY_EMAIL_ENABLE || 'true' }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO || 'ce.boutajar@gmail.com' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # réglages
          FACELESS_TOPIC: ${{ vars.FACELESS_TOPIC || 'AI tools & automation to make money and work smarter' }}
          FACELESS_VOICE: ${{ vars.FACELESS_VOICE || 'en-US-GuyNeural' }}
          FACELESS_WORDS: ${{ vars.FACELESS_WORDS || '150' }}
          FACELESS_PER_RUN: ${{ vars.FACELESS_PER_RUN || '2' }}
          DRIVE_CLEANUP_MAX_AGE_H: ${{ vars.DRIVE_CLEANUP_MAX_AGE_H || '48' }}
          LOG_LEVEL: INFO
          DRY_RUN: ${{ inputs.dry_run }}
        run: python faceless_main.py

      - name: Upload debug (si échec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faceless-debug
          path: faceless.log
          if-no-files-found: ignore
          retention-days: 5
